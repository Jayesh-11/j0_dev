<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitty.conf | Jayesh Vyavahare</title>
    <meta
      name="description"
      content="Kitty.conf as used on my 16inch m1 max and 27inch BenQ 1080p monitor"
    />
    <link rel="stylesheet" href="../index.css" />
    <style type="text/css">
      .kitty-conf-code-copy {
        align-self: flex-end;
        width: fit-content;
        border-radius: 8px;
        background-color: #fff;
        border: 1px solid #000;
        cursor: pointer;
        transition: all 0.1s cubic-bezier(0.23, 1, 0.32, 1);
        font-family: monospace;
        border: 2px solid #5933f3;
        border-bottom-right-radius: 0px;
        border-bottom-left-radius: 0px;
        transform: translateY(2px);
      }

      .kitty-conf-code-copy:active {
        transform: translateY(0px);
        background-color: #00ff08;
      }

      .code-container {
        display: flex;
        flex-direction: column;
      }
    </style>
    <style>
      .gist-data {
        border-radius: 8px !important;
        border: 2px solid #5933f3 !important;
        border-left-width: 4px !important;
        border-top-right-radius: 0px !important;
      }

      .gist-meta {
        background-color: #fff !important;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>Kitty.conf</h1>
    </header>
    <p>Kitty is a pretty cool terminal, below is my config.</p>
    <div class="code-container">
      <button id="kitty-conf-code-copy" class="kitty-conf-code-copy">
        Copy
      </button>
      <script src="https://gist.github.com/Jayesh-11/52d209ad0a9e638a8c000031d89492f7.js"></script>
    </div>
    <span>&thinsp;</span>
    <footer>
      <div class="footer-socials">
        <a class="redirect" target="_blank" href="https://github.com/Jayesh-11"
          >Github</a
        >
        <a class="redirect" target="_blank" href="https://x.com/Jayesh_eleven"
          >X</a
        >
        <a
          class="redirect"
          target="_blank"
          href="https://www.youtube.com/@jayesh_dev"
          >Youtube</a
        >
      </div>
      <a class="redirect" href="../index.html">Home</a>
    </footer>
    <script>
      const kittyConfCodeCopyButton = document
        .getElementById("kitty-conf-code-copy")
        .addEventListener("click", async () => {
          const link =
            document.getElementsByClassName("Link--inTextBlock")[0].href;
          const updatedLink = link
            .replace("github", "githubusercontent")
            .split("/")
            .slice(0, -2)
            .join("/");
          const res = await fetch(updatedLink);
          const code = await res.text();
          window.navigator.clipboard.writeText(code);
        });
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-GVB59BB2Z1"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-GVB59BB2Z1");
    </script>
  </body>
</html>

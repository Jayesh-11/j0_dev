<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RectangleConfig.json | Jayesh Vyavahare</title>
    <meta
      name="description"
      content="I'm experimenting with 4:3 ratio for some of the apps that I use, will post in some days, meanwhile - RectangleConfig.json as used on my 16inch m1 max and 27inch BenQ 1080p monitor"
    />
    <style type="text/css">
      body {
        margin: 40px auto;
        max-width: 650px;
        line-height: 1.6;
        font-size: 16px;
        color: #444;
        padding: 0 10px;
        font-family: monospace;
      }

      h1,
      h2,
      h3 {
        line-height: 1.2;
      }

      a {
        text-decoration: none;
      }

      .rectangle-conf-code-copy {
        align-self: flex-end;
        width: fit-content;
        border-radius: 8px;
        background-color: #fff;
        border: 1px solid #000;
        cursor: pointer;
        transition: all 0.1s cubic-bezier(0.23, 1, 0.32, 1);
        font-family: monospace;
        border: 2px solid #5933f3;
        border-bottom-right-radius: 0px;
        border-bottom-left-radius: 0px;
        transform: translateY(2px);
      }

      .code-container {
        display: flex;
        flex-direction: column;
      }

      .rectangle-conf-code-copy:active {
        transform: translateX(0px);
        background-color: #00ff08;
      }

      footer {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        gap: 12px;
      }

      .footer-socials {
        display: flex;
        justify-content: center;
        gap: 12px;
      }
    </style>
  </head>

  <body>
    <header>
      <h1>RectangleConfig.json</h1>
    </header>
    <p>
      Experimenting with ~4:3 ratio for the applications, works really well for
      some and not for some. Either way mac remembers window sizes so its being
      selective about which apps have which aspect ratio.
    </p>
    <div class="code-container">
      <button id="rectangle-conf-code-copy" class="rectangle-conf-code-copy">
        Copy
      </button>
      <script src="https://gist.github.com/Jayesh-11/cd236418c5e55138460b635cad8d3a67.js"></script>
    </div>
    <span>&thinsp;</span>
    <footer>
      <div class="footer-socials">
        <a class="redirect" target="_blank" href="https://github.com/Jayesh-11"
          >Github</a
        >
        <a class="redirect" target="_blank" href="https://x.com/Jayesh_eleven"
          >X</a
        >
        <a
          class="redirect"
          target="_blank"
          href="https://www.youtube.com/@jayesh_dev"
          >Youtube</a
        >
      </div>
      <a class="redirect" href="../index.html">Home</a>
    </footer>
    <script>
      const rectangleConfCodeCopyButton = document
        .getElementById("rectangle-conf-code-copy")
        .addEventListener("click", async () => {
          const link =
            document.getElementsByClassName("Link--inTextBlock")[0].href;
          const updatedLink = link
            .replace("github", "githubusercontent")
            .split("/")
            .slice(0, -2)
            .join("/");
          const res = await fetch(updatedLink);
          const code = await res.text();
          window.navigator.clipboard.writeText(code);
        });
    </script>
    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-GVB59BB2Z1"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "G-GVB59BB2Z1");
    </script>
  </body>
</html>
